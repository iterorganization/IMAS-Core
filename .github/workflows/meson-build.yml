name: Meson Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  meson-build:
    name: meson-build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.4

      - name: Configure Meson project
        run: |
          pixi run meson setup builddir \
            -Dal_dummy_exe=true \
            -Dpython_bindings=true \
            -Dal_backend_hdf5=true \
            -Dal_backend_uda=true \
            -Dal_backend_mdsplus=false

      - name: Run Meson tests
        run: pixi run meson test -C builddir --verbose
