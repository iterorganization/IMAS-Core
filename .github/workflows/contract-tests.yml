name: Contract suite — functional (blocking)

# PRD user story 23 (issue #1): the whole suite runs in CI on every PR so a
# change breaking any pinned capability fails fast. This is the BLOCKING
# functional leg — a plain (non-sanitized) build that runs everything ctest
# knows about, including the Death tests and the CurrentlyCorrupts tripwires
# that the informational sanitizer leg (sanitizers.yml) excludes. An xfail
# flipping to pass (a DISABLED_ test's tripwire going red) or a green test
# going red both fail this check.

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  contract-functional:
    name: Contract tests (Linux, ${{ matrix.preset }}, blocking)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both build modes (issue #32): the dlopen-failure plugin pin is
        # build-mode dependent — assert-abort death test in Debug, swallowed
        # assert tripwire under NDEBUG (RelWithDebInfo) — so each branch needs
        # its own leg or one of them never runs anywhere. The presets
        # (CMakePresets.json) are the single source of truth for flags and
        # binary dirs; builddir here only feeds the label-partition check.
        include:
          - preset: tests        # RelWithDebInfo
            builddir: build
          - preset: tests-debug
            builddir: build-debug

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # git describe needs full history for the version macro

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libhdf5-dev libboost-filesystem-dev

      - name: Configure (tests on, no Python bindings)
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Issue #31: an empty `ctest -L unit` exits 0, so a broken label
      # partition is invisible to the test run below — check it explicitly.
      - name: Verify unit/integration label partition
        run: bash tests/contract/check_label_partition.sh ${{ matrix.builddir }}/tests/contract

      - name: Run the whole test suite
        run: ctest --preset ${{ matrix.preset }}
