name: Build

on: [push, pull_request]

jobs:
  build_wheels:
    name: build_wheels (Python ${{ matrix.python }}, ${{ matrix.platform_id }}, ${{ matrix.AL_BACKEND_HDF5 }}, ${{ matrix.AL_BACKEND_MDSPLUS }}, ${{ matrix.AL_BACKEND_UDA }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Ensure that a wheel builder finishes even if another fails
      fail-fast: false
      matrix:
        # Github Actions doesn't support pairing matrix values together
        include:

          - os: ubuntu-24.04
            triplet: x64-linux
            python: 310
            cibw_platform: linux
            cibw_archs: x86_64
            platform_id: manylinux_x86_64
            manylinux_image: quay.io/pypa/manylinux_2_28_x86_64
            AL_BACKEND_HDF5: AL_BACKEND_HDF5=ON
            AL_BACKEND_MDSPLUS: AL_BACKEND_MDSPLUS=OFF
            AL_BACKEND_UDA: AL_BACKEND_UDA=ON
            UDA_REF: "2.9.3"
            FMT_REF: "11.1.4"

          - os: ubuntu-24.04
            triplet: x64-linux
            python: 311
            cibw_platform: linux
            cibw_archs: x86_64
            platform_id: manylinux_x86_64
            manylinux_image: quay.io/pypa/manylinux_2_28_x86_64
            AL_BACKEND_HDF5: AL_BACKEND_HDF5=ON
            AL_BACKEND_MDSPLUS: AL_BACKEND_MDSPLUS=OFF
            AL_BACKEND_UDA: AL_BACKEND_UDA=ON
            UDA_REF: "2.9.3"
            FMT_REF: "11.1.4"

          - os: ubuntu-24.04
            triplet: x64-linux
            python: 312
            cibw_platform: linux
            cibw_archs: x86_64
            platform_id: manylinux_x86_64
            manylinux_image: quay.io/pypa/manylinux_2_28_x86_64
            AL_BACKEND_HDF5: AL_BACKEND_HDF5=ON
            AL_BACKEND_MDSPLUS: AL_BACKEND_MDSPLUS=OFF
            AL_BACKEND_UDA: AL_BACKEND_UDA=ON
            UDA_REF: "2.9.3"
            FMT_REF: "11.1.4"

          - os: ubuntu-24.04
            triplet: x64-linux
            python: 313
            cibw_platform: linux
            cibw_archs: x86_64
            platform_id: manylinux_x86_64
            manylinux_image: quay.io/pypa/manylinux_2_28_x86_64
            AL_BACKEND_HDF5: AL_BACKEND_HDF5=ON
            AL_BACKEND_MDSPLUS: AL_BACKEND_MDSPLUS=OFF
            AL_BACKEND_UDA: AL_BACKEND_UDA=ON
            UDA_REF: "2.9.3"
            FMT_REF: "11.1.4"

          - os: ubuntu-24.04
            triplet: x64-linux
            python: 314
            cibw_platform: linux
            cibw_archs: x86_64
            platform_id: manylinux_x86_64
            manylinux_image: quay.io/pypa/manylinux_2_28_x86_64
            AL_BACKEND_HDF5: AL_BACKEND_HDF5=ON
            AL_BACKEND_MDSPLUS: AL_BACKEND_MDSPLUS=OFF
            AL_BACKEND_UDA: AL_BACKEND_UDA=ON
            UDA_REF: "2.9.3"
            FMT_REF: "11.1.4"

          - os: ubuntu-24.04-arm
            triplet: arm64-linux
            python: 310
            cibw_platform: linux
            cibw_archs: aarch64
            platform_id: manylinux_aarch64
            manylinux_image: quay.io/pypa/manylinux_2_28_aarch64
            AL_BACKEND_HDF5: AL_BACKEND_HDF5=ON
            AL_BACKEND_MDSPLUS: AL_BACKEND_MDSPLUS=OFF
            AL_BACKEND_UDA: AL_BACKEND_UDA=ON
            UDA_REF: "2.9.3"
            FMT_REF: "11.1.4"

          - os: ubuntu-24.04-arm
            triplet: arm64-linux
            python: 311
            cibw_platform: linux
            cibw_archs: aarch64
            platform_id: manylinux_aarch64
            manylinux_image: quay.io/pypa/manylinux_2_28_aarch64
            AL_BACKEND_HDF5: AL_BACKEND_HDF5=ON
            AL_BACKEND_MDSPLUS: AL_BACKEND_MDSPLUS=OFF
            AL_BACKEND_UDA: AL_BACKEND_UDA=ON
            UDA_REF: "2.9.3"
            FMT_REF: "11.1.4"

          - os: ubuntu-24.04-arm
            triplet: arm64-linux
            python: 312
            cibw_platform: linux
            cibw_archs: aarch64
            platform_id: manylinux_aarch64
            manylinux_image: quay.io/pypa/manylinux_2_28_aarch64
            AL_BACKEND_HDF5: AL_BACKEND_HDF5=ON
            AL_BACKEND_MDSPLUS: AL_BACKEND_MDSPLUS=OFF
            AL_BACKEND_UDA: AL_BACKEND_UDA=ON
            UDA_REF: "2.9.3"
            FMT_REF: "11.1.4"

          - os: ubuntu-24.04-arm
            triplet: arm64-linux
            python: 313
            cibw_platform: linux
            cibw_archs: aarch64
            platform_id: manylinux_aarch64
            manylinux_image: quay.io/pypa/manylinux_2_28_aarch64
            AL_BACKEND_HDF5: AL_BACKEND_HDF5=ON
            AL_BACKEND_MDSPLUS: AL_BACKEND_MDSPLUS=OFF
            AL_BACKEND_UDA: AL_BACKEND_UDA=ON
            UDA_REF: "2.9.3"
            FMT_REF: "11.1.4"

          - os: ubuntu-24.04-arm
            triplet: arm64-linux
            python: 314
            cibw_platform: linux
            cibw_archs: aarch64
            platform_id: manylinux_aarch64
            manylinux_image: quay.io/pypa/manylinux_2_28_aarch64
            AL_BACKEND_HDF5: AL_BACKEND_HDF5=ON
            AL_BACKEND_MDSPLUS: AL_BACKEND_MDSPLUS=OFF
            AL_BACKEND_UDA: AL_BACKEND_UDA=ON
            UDA_REF: "2.9.3"
            FMT_REF: "11.1.4"

          - os: macos-14
            triplet: arm64-osx
            python: 310
            platform_id: macosx_arm64
            cibw_platform: macos
            cibw_archs: arm64
            AL_BACKEND_HDF5: AL_BACKEND_HDF5=ON
            AL_BACKEND_MDSPLUS: AL_BACKEND_MDSPLUS=OFF
            AL_BACKEND_UDA: AL_BACKEND_UDA=ON
            UDA_REF: "2.9.3"

          - os: macos-14
            triplet: arm64-osx
            python: 311
            platform_id: macosx_arm64
            cibw_platform: macos
            cibw_archs: arm64
            AL_BACKEND_HDF5: AL_BACKEND_HDF5=ON
            AL_BACKEND_MDSPLUS: AL_BACKEND_MDSPLUS=OFF
            AL_BACKEND_UDA: AL_BACKEND_UDA=ON
            UDA_REF: "2.9.3"
        
          - os: macos-14
            triplet: arm64-osx
            python: 312
            platform_id: macosx_arm64
            cibw_platform: macos
            cibw_archs: arm64
            AL_BACKEND_HDF5: AL_BACKEND_HDF5=ON
            AL_BACKEND_MDSPLUS: AL_BACKEND_MDSPLUS=OFF
            AL_BACKEND_UDA: AL_BACKEND_UDA=ON
            UDA_REF: "2.9.3"
    
          - os: macos-14
            triplet: arm64-osx
            python: 313
            platform_id: macosx_arm64
            cibw_platform: macos
            cibw_archs: arm64
            AL_BACKEND_HDF5: AL_BACKEND_HDF5=ON
            AL_BACKEND_MDSPLUS: AL_BACKEND_MDSPLUS=OFF
            AL_BACKEND_UDA: AL_BACKEND_UDA=ON
            UDA_REF: "2.9.3"
    
          - os: macos-14
            triplet: arm64-osx
            python: 314
            platform_id: macosx_arm64
            cibw_platform: macos
            cibw_archs: arm64
            AL_BACKEND_HDF5: AL_BACKEND_HDF5=ON
            AL_BACKEND_MDSPLUS: AL_BACKEND_MDSPLUS=OFF
            AL_BACKEND_UDA: AL_BACKEND_UDA=ON
            UDA_REF: "2.9.3"
    
          # Windows wheels are built by the dedicated build_wheels_windows job
          # below: they share a vcpkg dependency tree prepared once by the
          # windows_deps job (issue #44), and keeping them in this matrix would
          # force `needs: windows_deps` onto the Linux/macOS legs too.

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # unshallow for setuptools-scm.get_version to discover tags

      - uses: actions/setup-python@v6
        with:
          # python installation used when to start cibuildwheel
          python-version: "3.12"
          cache: 'pip'

      - name: Restore cibuildwheel cache
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/cibuildwheel
            ~/.cache/cibuildwheel
          # cf. CIBW_CACHE_PATH
          key: "cibuildwheel-${{ runner.os }}-${{ runner.arch }}-cp${{ matrix.python }}-${{ matrix.platform_id }}"

      - uses: pypa/cibuildwheel@v4.1.0
        if: startsWith(matrix.os, 'ubuntu-')
        env:
          CIBW_BUILD: cp${{ matrix.python }}-${{ matrix.platform_id }}
          CIBW_PLATFORM: ${{ matrix.cibw_platform }}
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux_image }}
          CIBW_MANYLINUX_AARCH64_IMAGE: ${{ matrix.manylinux_image }}
          CIBW_SKIP: "cp31?t-*"  # Skip free-threading builds (not supported yet)

          # Install system libraries
          # NOTE: manylinux_2_28 is AlmaLinux 8 based, e.g. use yum/dnf
          # NOTE: MDSplus RPMs are only distributed for x86_64, skip on other
          # architectures (the MDSplus backend is OFF for wheel builds anyway)
          CIBW_BEFORE_ALL_LINUX: >
            dnf update -y >&2;
            dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm >&2;
            dnf -y install openssl-devel >&2;
            dnf -y install ninja-build >&2;
            dnf -y install boost1.78-devel >&2;
            dnf -y install capnproto capnproto-devel >&2;
            dnf -y install fmt fmt-devel >&2;
            dnf -y install spdlog spdlog-devel libxml2-devel libtirpc-devel >&2;
            dnf -y install libxslt >&2;
            dnf -y install hdf5-devel >&2;
            curl -LO https://github.com/ukaea/UDA/archive/refs/tags/${{matrix.UDA_REF}}.tar.gz  >&2;
            tar zxf ${{matrix.UDA_REF}}.tar.gz  >&2;
            cd UDA-${{matrix.UDA_REF}}  >&2;
            cmake -B build . --trace --debug-find -Wno-deprecated -DBUILD_SHARED_LIBS:BOOL=ON -DSSLAUTHENTICATION:BOOL=ON -DCLIENT_ONLY:BOOL=ON -DENABLE_CAPNP:BOOL=ON >&2  >&2;
            cmake --build build --target install >&2  >&2;
            cmake --install build >&2  >&2;
            cd ..  >&2;
            # curl -LO https://github.com/fmtlib/fmt/archive/refs/tags/${{matrix.FMT_REF}}.tar.gz &&
            # tar zxf ${{matrix.FMT_REF}}.tar.gz && cd fmt-${{matrix.FMT_REF}} &&
            # cmake -G Ninja -B build . -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_INSTALL_LIBDIR:STRING=lib -DFMT_DOC:BOOL=OFF -DFMT_TEST:BOOL=OFF -DBUILD_SHARED_LIBS:BOOL=ON >&2 &&
            # cmake --build build --target install >&2 &&
            # cmake --install build >&2 && cd .. ;


          # FIXME: on manylinux_2_28, the ninja package seems to be too old, producing this error:
          # ninja: error: build.ninja:826: multiple outputs aren't (yet?) supported by depslog; bring this up on the mailing list if it affects you
          # trying not to use ninja:
          CIBW_ENVIRONMENT_LINUX: CMAKE_GENERATOR="Unix Makefiles"

          CIBW_CONFIG_SETTINGS: >
            cmake.define.${{ matrix.AL_BACKEND_HDF5 }}
            cmake.define.${{ matrix.AL_BACKEND_MDSPLUS }}
            cmake.define.${{ matrix.AL_BACKEND_UDA }}

        with:
          package-dir: .
          output-dir: wheelhouse
          config-file: "{package}/pyproject.toml"

      - uses: pypa/cibuildwheel@v4.1.0
        if: startsWith(matrix.os, 'macos-')
        env:
          CIBW_BUILD: cp${{ matrix.python }}-${{ matrix.platform_id }}
          CIBW_PLATFORM: macos
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_SKIP: "cp31?t-*"  # Skip free-threading builds (not supported yet)

          CIBW_CONFIG_SETTINGS: >
            cmake.define.${{ matrix.AL_BACKEND_HDF5 }}
            cmake.define.${{ matrix.AL_BACKEND_MDSPLUS }}
            cmake.define.${{ matrix.AL_BACKEND_UDA }}

          # Dependency installation into /tmp/imas-core-install
          CIBW_BEFORE_ALL_MACOS: >
            brew update >&2;
            brew install cmake pkg-config boost hdf5 libomp ninja fmt spdlog libxml2 openssl libmemcached >&2;
            git clone -b master https://github.com/capnproto/capnproto.git >&2 &&
            cd capnproto >&2;
            cmake -B build . \
                -DCMAKE_INSTALL_PREFIX=/tmp/imas-core-install >&2 &&
            cmake --build build --target install -j >&2;
            git clone --depth 1 --branch ${{ matrix.UDA_REF }} https://github.com/ukaea/UDA.git >&2 &&
            cd UDA >&2;
            cmake -G Ninja -B build . \
                -DBUILD_SHARED_LIBS=ON \
                -DSSLAUTHENTICATION=ON \
                -DCLIENT_ONLY=ON \
                -DENABLE_CAPNP=ON \
                -DMACOSX_DEPLOYMENT_TARGET=14.0 \
                -DCMAKE_INSTALL_PREFIX=/tmp/imas-core-install >&2 &&
            cmake --build build --target install -j >&2;

          # Where to find the dependencies
          CIBW_ENVIRONMENT_MACOS: >
            MACOSX_DEPLOYMENT_TARGET=14.0
            CMAKE_PREFIX_PATH="/tmp/imas-core-install:/opt/homebrew:/usr/local"
            PKG_CONFIG_PATH="/tmp/imas-core-install/lib/pkgconfig:/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig"

        with:
          package-dir: .
          output-dir: wheelhouse
          config-file: "{package}/pyproject.toml"

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-cp${{ matrix.python }}-${{ matrix.platform_id }}
          path: wheelhouse/*.whl
          retention-days: 1

  # Issue #44: prepare the pinned x64-windows vcpkg dependency closure ONCE,
  # then let every Windows wheel job restore it read-only. Previously all five
  # cold matrix jobs independently ran vcpkg against the same upstream source
  # hosts and the same mutable cache key: a rate-limited host (HTTP 429 from
  # gitlab.dkrz.de for libaec) failed the whole blocking workflow, and the five
  # always-save steps raced on one key. Now a cold workflow downloads each
  # source archive at most once (both C:\vcpkg\installed and the
  # content-addressed C:\vcpkg\downloads are cached), and only this job ever
  # saves the cache.
  windows_deps:
    name: Prepare Windows vcpkg dependencies
    runs-on: windows-2022
    env:
      # The before-build script's default (matrix.UDA_REF was never exported to
      # the Windows build environment, so Windows has always built this
      # version); pinned explicitly here because it is part of the cache key.
      UDA_REF: "2.8.1"
      VCPKG_ROOT: C:/vcpkg
      VCPKG_TARGET_TRIPLET: x64-windows
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Compute content-addressed cache key
        id: key
        # Key covers the manifest (vcpkg.json), the dependency-install script,
        # the triplet, the UDA ref, and the runner's vcpkg baseline commit —
        # any of these changing invalidates the prepared tree. restore-keys
        # allow warm partial reuse; the exact key is what wheel jobs consume.
        run: |
          vcpkg_commit=$(git -C /c/vcpkg rev-parse HEAD 2>/dev/null || echo unknown)
          echo "key=win-deps-${VCPKG_TARGET_TRIPLET}-uda${UDA_REF}-${{ hashFiles('vcpkg.json', 'ci/wheels/cibw_before_build_win.sh') }}-vcpkg-${vcpkg_commit}" >> "$GITHUB_OUTPUT"

      - name: Cache vcpkg installed tree and downloads
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
          key: ${{ steps.key.outputs.key }}
          restore-keys: |
            win-deps-${{ env.VCPKG_TARGET_TRIPLET }}-uda${{ env.UDA_REF }}-

      - name: Install the pinned dependency closure (cold cache only)
        if: steps.cache.outputs.cache-hit != 'true'
        # The same script every wheel job runs as CIBW before-build; running it
        # here keeps a single source of truth for the closure. It is idempotent
        # against a partially restored tree: vcpkg skips installed packages and
        # the UDA build is skipped when uda-cpp.pc is already installed — which
        # also makes the retry loop below resume where the last attempt left
        # off. The backoff exists because vcpkg's own retries are seconds
        # apart: a rate-limiting upstream (HTTP 429 from gitlab.dkrz.de for
        # libaec, issue #44) needs minutes for its window to reset.
        run: |
          for attempt in 1 2 3 4 5; do
            if bash ./ci/wheels/cibw_before_build_win.sh; then
              exit 0
            fi
            echo "Dependency install attempt ${attempt} failed (upstream rate limit?); backing off $((attempt * 90))s"
            sleep $((attempt * 90))
          done
          echo "FATAL: dependency closure install failed after 5 attempts"
          exit 1

  build_wheels_windows:
    name: build_wheels (Python ${{ matrix.python }}, win_amd64)
    runs-on: windows-2022
    needs: [windows_deps]
    strategy:
      # Ensure that a wheel builder finishes even if another fails
      fail-fast: false
      matrix:
        python: [310, 311, 312, 313, 314]

    # Recent changes in GitHub Actions Cache's API have rendered the x-gha
    # binary caching provider useless.
    # See https://github.com/microsoft/vcpkg-tool/pull/1662 — vcpkg reuse is
    # instead provided by the windows_deps job's prepared-tree cache above.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # unshallow for setuptools-scm.get_version to discover tags

      - uses: actions/setup-python@v6
        with:
          # python installation used when to start cibuildwheel
          python-version: "3.12"
          cache: 'pip'

      - name: Install cibuildwheel for windows
        run: |
          python -m pip install cibuildwheel==3.1.0

      - name: Restore cibuildwheel cache
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\pypa\cibuildwheel\Cache
          # cf. CIBW_CACHE_PATH
          key: "cibuildwheel-${{ runner.os }}-${{ runner.arch }}-cp${{ matrix.python }}-win_amd64"

      - name: Restore prepared windows deps (read-only)
        uses: actions/cache/restore@v6
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
          key: ${{ needs.windows_deps.outputs.cache-key }}
          # The key was saved (or verified) by windows_deps in this same run; a
          # miss means the prepared tree is unavailable and this job would fall
          # back to a cold upstream fetch — the stampede issue #44 removes.
          fail-on-cache-miss: true

      - name: Build wheels for windows
        run: |
          python -c "import sys, pprint, cibuildwheel; pprint.pp(sys.path); pprint.pp(cibuildwheel)"
          python -m cibuildwheel --output-dir wheelhouse --config-file pyproject.toml
        env:
          UDA_REF: "2.8.1"  # keep in sync with windows_deps.env.UDA_REF
          CIBW_BUILD: cp${{ matrix.python }}-win_amd64
          CIBW_PLATFORM: windows
          CIBW_ARCHS: AMD64
          CIBW_BUILD_VERBOSITY: 1
          CIBW_SKIP: "cp31?t-*"  # Skip free-threading builds (not supported yet)
          CIBW_CONFIG_SETTINGS: >
            cmake.define.AL_BACKEND_HDF5=ON
            cmake.define.AL_BACKEND_MDSPLUS=OFF
            cmake.define.AL_BACKEND_UDA=OFF
          # cmake.args="--debug-find;--debug-output"

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-cp${{ matrix.python }}-win_amd64
          path: wheelhouse/*.whl
          retention-days: 1

  publish_wheels_testpypi:
    # only publish to TestPyPI on develop pushes and not from forks
    if: github.ref=='refs/heads/develop' && github.repository_owner == 'iterorganization'
    needs: [build_wheels, build_wheels_windows]
    runs-on: ubuntu-24.04
    permissions:
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write
    environment:
      # Specifying a GitHub environment is optional, but strongly encouraged
      name: testpypi
      url: https://test.pypi.org/p/imas-core
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-wheels-*
          merge-multiple: true  # avoid artifact subdirs below wheelhouse
          path: wheelhouse
      - name: list wheelhouse
        run: ls -R wheelhouse
      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          packages-dir: wheelhouse
          repository-url: https://test.pypi.org/legacy/

  publish_wheels_pypi:
    # only publish to PyPI on tag pushes and not from forks
    if: startsWith(github.ref, 'refs/tags/') && github.repository_owner == 'iterorganization'
    needs: [build_wheels, build_wheels_windows]
    runs-on: ubuntu-24.04
    permissions:
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write
    environment:
      # Specifying a GitHub environment is optional, but strongly encouraged
      name: pypi
      url: https://pypi.org/p/imas-core
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-wheels-*
          merge-multiple: true  # avoid artifact subdirs below wheelhouse
          path: wheelhouse
      - name: list wheelhouse
        run: ls -R wheelhouse
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          packages-dir: wheelhouse
          # repository-url: https://test.pypi.org/legacy/
